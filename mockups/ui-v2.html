<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalletBloom · UI 方案</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sf: ['-apple-system','BlinkMacSystemFont','"SF Pro Text"','"SF Pro Display"','system-ui','sans-serif'] },
      colors: { accent: '#0A84FF' },
      borderRadius: { xl2: '20px' },
    }}
  }
</script>
<style>
  :root { color-scheme: light dark; }
  body {
    background:
      radial-gradient(1200px 700px at 12% -10%, #dfe7ff 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 110%, #ffe6f2 0%, transparent 50%),
      linear-gradient(160deg, #eef1f6 0%, #e7ebf2 100%);
    min-height: 100vh;
  }
  @media (prefers-color-scheme: dark) {
    body { background:
      radial-gradient(1200px 700px at 12% -10%, #1a2450 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 110%, #3a1830 0%, transparent 50%),
      linear-gradient(160deg, #16181d 0%, #0f1013 100%); }
  }
  .vibrancy { background: rgba(255,255,255,0.72); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); }
  .vibrancy-strong { background: rgba(255,255,255,0.85); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); }
  @media (prefers-color-scheme: dark) {
    .vibrancy { background: rgba(38,40,46,0.72); }
    .vibrancy-strong { background: rgba(30,32,37,0.9); }
  }
  .hairline { box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
  @media (prefers-color-scheme: dark) { .hairline { box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.14); } }
  .card-face { aspect-ratio: 1586 / 1000; }
  .stack-card { transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .45s, filter .45s; }
  .skin-cell { transition: transform .18s ease, box-shadow .18s ease; }
  .skin-cell:hover { transform: translateY(-2px); }
  .skin-cell[data-active="true"] { box-shadow: 0 0 0 2.5px #0A84FF, 0 8px 20px rgba(10,132,255,.25); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,120,128,.35); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin { animation: spin 1s linear infinite; }
  @keyframes fadein { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .fadein { animation: fadein .35s ease both; }
  @keyframes pulse-ring { 0%{transform:scale(.9);opacity:.7} 70%{transform:scale(1.25);opacity:0} 100%{opacity:0} }
  .pulse-ring { animation: pulse-ring 1.8s ease-out infinite; }
</style>
</head>
<body class="font-sf text-[13px] text-neutral-800 dark:text-neutral-100 antialiased">

<!-- demo state switcher -->
<div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 p-1 rounded-full vibrancy-strong ring-1 ring-black/10 dark:ring-white/10 shadow text-[11px]">
  <span class="px-2 text-neutral-400 font-medium">演示状态</span>
  <button onclick="setScreen('onboarding')" class="seg px-3 py-1 rounded-full">未连接</button>
  <button onclick="setScreen('scanning')"   class="seg px-3 py-1 rounded-full">扫描中</button>
  <button onclick="setScreen('empty')"      class="seg px-3 py-1 rounded-full">无卡片</button>
  <button onclick="setScreen('error')"      class="seg px-3 py-1 rounded-full">故障</button>
  <button onclick="setScreen('main')"       class="seg px-3 py-1 rounded-full">主界面</button>
</div>

<div class="min-h-screen flex items-center justify-center p-6 pt-16">

  <div class="w-full max-w-[1000px] h-[660px] rounded-xl2 overflow-hidden shadow-[0_40px_120px_-20px_rgba(0,0,0,.5)] ring-1 ring-black/10 dark:ring-white/10 flex flex-col vibrancy-strong">

    <!-- ===== Title bar ===== -->
    <div class="h-[50px] shrink-0 flex items-center px-4 gap-3 border-b border-black/5 dark:border-white/10">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-[#ff5f57] ring-1 ring-black/10"></span>
        <span class="w-3 h-3 rounded-full bg-[#febc2e] ring-1 ring-black/10"></span>
        <span class="w-3 h-3 rounded-full bg-[#28c840] ring-1 ring-black/10"></span>
      </div>
      <div class="flex items-center gap-2 ml-3">
        <div class="w-6 h-6 rounded-[7px] bg-gradient-to-br from-accent to-indigo-500 flex items-center justify-center shadow-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2l1.9 5.5L19.5 8l-4.2 3.6L16.8 17 12 13.9 7.2 17l1.5-5.4L4.5 8l5.6-.5z"/></svg>
        </div>
        <span class="font-semibold text-[13px] tracking-tight">WalletBloom</span>
      </div>
      <div class="flex-1"></div>
      <!-- connection pill -->
      <div id="connPill"></div>
    </div>

    <!-- ===== Screen host ===== -->
    <div id="host" class="flex-1 flex flex-col overflow-hidden"></div>

  </div>
</div>

<script>
// ================= data =================
const cards = [
  { title:'Wallet Card', hash:'5sI=', kind:'payment' },
  { title:'Wallet Card', hash:'dPM=', kind:'transit' },
  { title:'Bloom Club',  hash:'1138', kind:'pass' },
];
const skins = [
  { name:'Sakura',      sub:'柔和樱花', grad:['#F6B7C8','#D9779B'] },
  { name:'Tokyo Night', sub:'城市霓虹', grad:['#171B35','#5B4AA8'] },
  { name:'Minimal',     sub:'纯净留白', grad:['#F1EEE8','#BEB7AC'] },
  { name:'Aurora',      sub:'极光渐变', grad:['#00C6A7','#1E4AE9'] },
  { name:'Sunset',      sub:'黄昏落日', grad:['#FF9966','#FF5E62'] },
  { name:'Ocean',       sub:'深海蓝调', grad:['#2E3192','#1BFFFF'] },
  { name:'Grape',       sub:'葡萄紫韵', grad:['#8E2DE2','#4A00E0'] },
  { name:'Forest',      sub:'森林绿意', grad:['#134E5E','#71B280'] },
  { name:'Peach',       sub:'蜜桃奶油', grad:['#FFD3A5','#FD6585'] },
  { name:'Graphite',    sub:'石墨质感', grad:['#434343','#000000'] },
  { name:'Gold',        sub:'流光金箔', grad:['#F7971E','#FFD200'] },
  { name:'Sky',         sub:'晴空白云', grad:['#56CCF2','#2F80ED'] },
];
let cardIdx = 0;
const cardSkin = cards.map(()=>0);

// ================= connection pill =================
function setPill(connected){
  const el = document.getElementById('connPill');
  el.innerHTML = connected
    ? `<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-green-500/12 text-green-600 dark:text-green-400 text-[12px] font-medium"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>“张亦梓”的 iPhone 13 mini</div>`
    : `<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-neutral-500/10 text-neutral-400 text-[12px] font-medium"><span class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span>未连接设备</div>`;
}

// ================= card face =================
function faceHTML(card, skinIdx){
  const s = skins[skinIdx];
  const emoji = card.kind==='transit' ? '🚉' : card.kind==='pass' ? '🎟️' : '💳';
  return `
    <div class="card-face w-full rounded-[16px] overflow-hidden relative text-white shadow-[0_16px_36px_-12px_rgba(0,0,0,.55)]"
         style="background:linear-gradient(135deg, ${s.grad[0]}, ${s.grad[1]});">
      <div class="absolute inset-0 p-4 flex flex-col justify-between">
        <div class="flex items-start justify-between">
          <span class="text-[19px] drop-shadow">${emoji}</span>
          <span class="text-[10px] font-semibold tracking-widest opacity-90">iPhone</span>
        </div>
        <div>
          <div class="text-[16px] font-semibold leading-tight drop-shadow-sm">${card.title}</div>
          <div class="text-[11px] font-medium tracking-[2px] opacity-85 mt-0.5">•••• ${card.hash}</div>
          <div class="text-[9px] font-bold tracking-[3px] opacity-70 mt-1.5">WALLET BLOOM · ${s.name.toUpperCase()}</div>
        </div>
      </div>
    </div>`;
}

// ================= MAIN screen =================
function mainHTML(){ return `
  <!-- compact card region -->
  <div class="shrink-0 px-8 pt-4 pb-3">
    <div class="flex items-center justify-between mb-2.5">
      <div class="flex items-baseline gap-2.5">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">我的卡片</span>
        <span id="cardTitle" class="text-[13px] font-medium text-neutral-500 dark:text-neutral-400"></span>
      </div>
      <div id="dots" class="flex items-center gap-1.5"></div>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="cycle(-1)" class="w-8 h-8 shrink-0 rounded-full vibrancy hairline flex items-center justify-center hover:scale-105 active:scale-95 transition">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="relative flex-1 flex justify-center" style="height:158px;">
        <div id="stack" class="relative w-[250px]"></div>
      </div>
      <button onclick="cycle(1)" class="w-8 h-8 shrink-0 rounded-full vibrancy hairline flex items-center justify-center hover:scale-105 active:scale-95 transition">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <!-- skins region (now taller) -->
  <div class="flex-1 overflow-hidden flex flex-col border-t border-black/5 dark:border-white/10 vibrancy">
    <div class="flex items-center justify-between px-8 pt-3.5 pb-2.5">
      <div class="text-[13px] font-semibold">选择皮肤</div>
      <div class="text-[12px] text-neutral-400">点击皮肤即时预览到卡面</div>
    </div>
    <div class="flex-1 overflow-y-auto px-8 pb-5">
      <div id="skinGrid" class="grid grid-cols-4 gap-3.5"></div>
    </div>
  </div>

  <!-- bottom toolbar -->
  <div class="h-[60px] shrink-0 flex items-center gap-3 px-6 border-t border-black/8 dark:border-white/10 vibrancy-strong">
    <button class="flex items-center gap-2 h-9 px-3.5 rounded-[9px] hairline bg-white/60 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 transition font-medium">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>导入图片
    </button>
    <button onclick="setScreen('scanning')" class="flex items-center gap-2 h-9 px-3.5 rounded-[9px] hairline bg-white/60 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 transition font-medium">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>重新扫描
    </button>
    <div class="flex-1 flex items-center justify-center gap-2 text-[12px] text-neutral-400">
      <svg id="statusSpin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>
      <span id="statusText"></span>
    </div>
    <button onclick="apply()" class="flex items-center gap-2 h-9 px-5 rounded-[9px] bg-accent text-white font-semibold shadow-[0_2px_8px_rgba(10,132,255,.4)] hover:brightness-105 active:brightness-95 transition">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>应用到 iPhone
    </button>
  </div>`;
}

function renderStack(){
  const stack = document.getElementById('stack'); if(!stack) return;
  stack.innerHTML = '';
  cards.forEach((card,i)=>{
    const off = i - cardIdx, abs = Math.abs(off), depth = Math.min(abs,2);
    const el = document.createElement('div');
    el.className='stack-card absolute top-0 left-0 w-full cursor-pointer';
    el.innerHTML = faceHTML(card, cardSkin[i]);
    el.style.transform = `translate(${(off>0?22:-22)*depth}px, ${depth*8}px) scale(${1-depth*0.07})`;
    el.style.zIndex = 100-abs;
    el.style.opacity = abs>2?0:(off===0?1:0.55);
    el.style.filter = off===0?'none':'brightness(.8)';
    el.style.pointerEvents = abs>2?'none':'auto';
    el.onclick = ()=>{ cardIdx=i; renderStack(); renderSkins(); };
    stack.appendChild(el);
  });
  document.getElementById('cardTitle').textContent = `${cards[cardIdx].title} · ${cards[cardIdx].hash}`;
  document.getElementById('dots').innerHTML = cards.map((_,i)=>`<span class="h-2 rounded-full transition-all ${i===cardIdx?'bg-accent w-5':'bg-neutral-300 dark:bg-neutral-600 w-2'}"></span>`).join('');
}
function renderSkins(){
  const grid=document.getElementById('skinGrid'); if(!grid) return;
  grid.innerHTML='';
  skins.forEach((s,i)=>{
    const active = cardSkin[cardIdx]===i;
    const cell=document.createElement('button');
    cell.className='skin-cell text-left rounded-[13px] overflow-hidden bg-white/70 dark:bg-white/5 hairline';
    cell.dataset.active=active;
    cell.innerHTML=`<div class="h-[64px] w-full" style="background:linear-gradient(135deg,${s.grad[0]},${s.grad[1]});"></div>
      <div class="px-2.5 py-2"><div class="text-[12px] font-semibold leading-tight">${s.name}</div><div class="text-[11px] text-neutral-400 leading-tight">${s.sub}</div></div>`;
    cell.onclick=()=>{ cardSkin[cardIdx]=i; renderStack(); renderSkins(); };
    grid.appendChild(cell);
  });
}
function cycle(d){ cardIdx=(cardIdx+d+cards.length)%cards.length; renderStack(); renderSkins(); }
function apply(){
  const spin=document.getElementById('statusSpin'), txt=document.getElementById('statusText');
  spin.classList.remove('hidden'); spin.classList.add('spin'); txt.textContent='正在应用皮肤到 iPhone…';
  setTimeout(()=>{ spin.classList.add('hidden'); spin.classList.remove('spin'); txt.textContent=`✓ 已应用 ${skins[cardSkin[cardIdx]].name} 到 ${cards[cardIdx].hash}`; },1600);
}

// ================= ONBOARDING screen =================
function stepRow(n, title, desc, icon){ return `
  <div class="flex items-start gap-3.5 fadein" style="animation-delay:${n*70}ms">
    <div class="w-7 h-7 shrink-0 rounded-full bg-accent/12 text-accent flex items-center justify-center font-semibold text-[13px]">${n}</div>
    <div class="pt-0.5">
      <div class="text-[13.5px] font-semibold flex items-center gap-1.5">${icon}${title}</div>
      <div class="text-[12.5px] text-neutral-500 dark:text-neutral-400 mt-0.5 leading-relaxed">${desc}</div>
    </div>
  </div>`;
}
const ic = (p)=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-400">${p}</svg>`;
function onboardingHTML(){ return `
  <div class="flex-1 flex items-center justify-center px-10">
    <div class="w-full max-w-[560px] flex items-center gap-10">
      <!-- left: illustration -->
      <div class="shrink-0 relative w-[190px] h-[240px] flex items-center justify-center">
        <div class="absolute w-28 h-28 rounded-full bg-accent/15 pulse-ring"></div>
        <div class="relative w-[130px] h-[200px] rounded-[26px] vibrancy hairline flex flex-col items-center justify-center gap-3 shadow-xl">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="text-accent"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 5h2"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-neutral-400"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <div class="w-9 h-9 rounded-[9px] bg-gradient-to-br from-accent to-indigo-500 flex items-center justify-center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2l1.9 5.5L19.5 8l-4.2 3.6L16.8 17 12 13.9 7.2 17l1.5-5.4L4.5 8l5.6-.5z"/></svg>
          </div>
        </div>
      </div>
      <!-- right: steps -->
      <div class="flex-1">
        <div class="text-[22px] font-bold tracking-tight fadein">连接你的 iPhone</div>
        <div class="text-[13px] text-neutral-500 dark:text-neutral-400 mt-1 mb-6 fadein">按以下步骤操作，即可扫描钱包中的卡片</div>
        <div class="space-y-4">
          ${stepRow(1,'用数据线连接 Mac 与 iPhone','推荐使用原装数据线，避免仅充电线',ic('<path d="M5 12h14M13 6l6 6-6 6"/>'))}
          ${stepRow(2,'在 iPhone 上点按“信任此电脑”','解锁 iPhone 并输入锁屏密码以授权',ic('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'))}
          ${stepRow(3,'打开 iPhone 上的钱包 App','或双击侧边（关机）键唤起钱包',ic('<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/>'))}
          ${stepRow(4,'点击下方“开始扫描卡片”','扫描约需 20 秒，请保持钱包打开',ic('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>'))}
        </div>
        <button onclick="setScreen('scanning')" class="mt-7 w-full h-11 rounded-[11px] bg-accent text-white font-semibold text-[14px] shadow-[0_4px_14px_rgba(10,132,255,.4)] hover:brightness-105 active:brightness-95 transition fadein">
          开始扫描卡片
        </button>
        <div class="text-center text-[11.5px] text-neutral-400 mt-3 fadein">连接后此步骤将自动跳过</div>
      </div>
    </div>
  </div>`;
}

// ================= SCANNING screen =================
function scanningHTML(){ return `
  <div class="flex-1 flex flex-col items-center justify-center gap-6 px-10">
    <div class="relative w-24 h-24 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full bg-accent/15 pulse-ring"></div>
      <div class="absolute inset-2 rounded-full bg-accent/15 pulse-ring" style="animation-delay:.6s"></div>
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-accent spin"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>
    </div>
    <div class="text-center">
      <div class="text-[18px] font-semibold">正在扫描 Wallet 卡片…</div>
      <div class="text-[13px] text-neutral-500 dark:text-neutral-400 mt-1.5">请在 iPhone 上保持钱包 App 打开，不要断开数据线</div>
    </div>
    <div class="w-[280px] h-1.5 rounded-full bg-neutral-500/15 overflow-hidden">
      <div class="h-full bg-accent rounded-full transition-all duration-500" style="width:0%" id="scanBar"></div>
    </div>
    <button onclick="setScreen('main')" class="text-[12px] text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200 transition underline underline-offset-2">跳过（演示）</button>
  </div>`;
}

// ================= EMPTY (no cards) screen =================
function emptyHTML(){ return `
  <div class="flex-1 flex flex-col items-center justify-center gap-5 px-10 text-center">
    <div class="w-20 h-20 rounded-full bg-neutral-500/8 flex items-center justify-center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="text-neutral-400"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10h20"/></svg>
    </div>
    <div>
      <div class="text-[18px] font-semibold">没有扫描到卡片</div>
      <div class="text-[13px] text-neutral-500 dark:text-neutral-400 mt-2 max-w-[380px] leading-relaxed">
        看起来你的钱包里还没有添加任何卡片。请在 iPhone 上打开「钱包」App，点击右上角「+」添加银行卡或交通卡后，再重新扫描。
      </div>
    </div>
    <div class="flex items-center gap-3 mt-1">
      <button onclick="setScreen('scanning')" class="h-9 px-5 rounded-[9px] bg-accent text-white font-semibold shadow-[0_2px_8px_rgba(10,132,255,.4)] hover:brightness-105 transition">重新扫描</button>
      <button onclick="setScreen('onboarding')" class="h-9 px-5 rounded-[9px] hairline bg-white/60 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 transition font-medium">查看连接步骤</button>
    </div>
  </div>`;
}

// ================= ERROR screen =================
function errorHTML(){ return `
  <div class="flex-1 flex flex-col items-center justify-center gap-5 px-10 text-center">
    <div class="w-20 h-20 rounded-full bg-orange-500/10 flex items-center justify-center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-orange-500"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    </div>
    <div>
      <div class="text-[18px] font-semibold">扫描遇到问题</div>
      <div class="text-[13px] text-neutral-500 dark:text-neutral-400 mt-2 max-w-[400px] leading-relaxed">
        无法读取钱包卡片，可能是设备兼容性或系统版本问题。请尝试重新连接设备；若问题持续，请联系技术支持。
      </div>
      <div class="inline-flex items-center gap-2 mt-3 px-3 py-1.5 rounded-lg bg-neutral-500/8 text-[12px] text-neutral-500 font-mono">
        错误代码：<span class="font-semibold">SCAN_TIMEOUT_0x20</span>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-1">
      <button onclick="setScreen('scanning')" class="h-9 px-5 rounded-[9px] bg-accent text-white font-semibold shadow-[0_2px_8px_rgba(10,132,255,.4)] hover:brightness-105 transition">重试</button>
      <button class="h-9 px-5 rounded-[9px] hairline bg-white/60 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 transition font-medium">联系技术支持</button>
    </div>
    <div class="text-[11.5px] text-neutral-400">技术支持：<span class="text-accent">support@walletbloom.app</span>（占位）</div>
  </div>`;
}

// ================= router =================
function setScreen(name){
  const host = document.getElementById('host');
  // seg highlight
  document.querySelectorAll('.seg').forEach(b=>{ b.classList.remove('bg-accent','text-white'); b.classList.add('text-neutral-500'); });
  const map = {onboarding:0, scanning:1, empty:2, error:3, main:4};
  const segs = document.querySelectorAll('.seg');
  if(segs[map[name]]){ segs[map[name]].classList.add('bg-accent','text-white'); segs[map[name]].classList.remove('text-neutral-500'); }

  setPill(name==='main');
  if(name==='main'){ host.innerHTML=mainHTML(); renderStack(); renderSkins(); return; }
  if(name==='onboarding'){ host.innerHTML=onboardingHTML(); return; }
  if(name==='empty'){ host.innerHTML=emptyHTML(); return; }
  if(name==='error'){ host.innerHTML=errorHTML(); return; }
  if(name==='scanning'){
    host.innerHTML=scanningHTML();
    let p=0; const bar=document.getElementById('scanBar');
    const t=setInterval(()=>{ p+=Math.random()*22; if(bar) bar.style.width=Math.min(p,100)+'%';
      if(p>=100){ clearInterval(t); setTimeout(()=>setScreen('main'),400); } },500);
    return;
  }
}

setScreen('onboarding');
</script>
